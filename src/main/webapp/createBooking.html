<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Booking</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<h1>Create New Booking</h1>
<button id="logoutBtn">Logout</button>
<button onclick="window.location.href='/diggydog/index.html'">Back to List</button>

<div class="block">
    <label for="date">Date (YYYY-MM-DD):</label>
    <input type="date" id="date" /><br />

    <label for="hourSelect">Booking Time:</label>
    <select id="hourSelect"></select> :
    <select id="minuteSelect"></select><br />

    <label for="bookingInfo">Booking Info:</label>
    <input type="text" id="bookingInfo" placeholder="Details about booking" /><br />

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Your Name" /><br />

    <label for="noPeople">No. of People:</label>
    <input type="number" id="noPeople" min="1" /><br />

    <button id="createBookingBtn">Create Booking</button>
</div>

<p id="message"></p>

<script src="/diggydog/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', initCreateBooking);
</script>
</body>
</html>
