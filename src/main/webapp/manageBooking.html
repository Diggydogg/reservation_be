<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Booking</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<h1>Manage Booking (Update / Delete)</h1>
<button id="logoutBtn">Logout</button>
<div id="userInfo"></div>

<div class="block">
    <h2>Update / Delete Booking</h2>
    <!-- Booking ID & User ID를 화면에 보이지 않도록 hidden input으로 처리 -->
    <input type="hidden" id="bookingId" />
    <input type="hidden" id="userId" />

    <label for="date">Date (YYYY-MM-DD):</label>
    <input type="date" id="date" /><br />

    <!-- 드롭다운 방식의 시/분 선택 -->
    <label for="hourSelect">Booking Time:</label>
    <select id="hourSelect"></select> :
    <select id="minuteSelect"></select><br />

    <label for="bookingInfo">Booking Info:</label>
    <input type="text" id="bookingInfo" placeholder="기타 정보" /><br />

    <label for="nameDisplay">Name:</label>
    <span id="nameDisplay" style="color: gray;">예약자 명</span><br />

    <label for="noPeople">No. People:</label>
    <input type="number" id="noPeople" min="1" /><br />

    <!-- Update & Delete 버튼을 같은 섹션에 두고, bookingId/userId를 hidden field로 관리 -->
    <button id="updateBtn">Update Booking</button>
    <button id="deleteBtn">Delete Booking</button>
</div>

<div id="message"></div>

<script src="app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', initManageBooking);
</script>
</body>
</html>
